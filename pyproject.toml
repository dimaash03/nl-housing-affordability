[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-housing"
version = "0.1.0"
description = "Housing affordability across Dutch municipalities (CBS StatLine -> DuckDB -> Power BI)."
readme = "README.md"
requires-python = ">=3.11"   # duckdb 2.x (requirements.txt) has no Python 3.10 wheels
# Runtime dependencies are pinned in requirements.txt; this file only makes
# `src/nl_housing` importable (`pip install -e .`).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "loopback: needs a local HTTP server on 127.0.0.1 (deselect with -m 'not loopback' in sandboxes that block sockets)",
]

[tool.ruff]
line-length = 120          # the codebase is written to 120 columns
target-version = "py311"   # minimum supported Python (requires-python)
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, N pep8-naming, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["nl_housing"]
known-local-folder = ["conftest", "geo_fixtures"]
