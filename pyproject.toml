[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-housing"
version = "0.1.0"
description = "Housing affordability across Dutch municipalities (CBS StatLine -> DuckDB -> Power BI)."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt; this file only makes
# `src/nl_housing` importable (`pip install -e .`).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
