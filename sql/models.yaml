# Execution order of the SQL models, read by `python -m nl_housing.transform`.
#
# - Each top-level key is a layer = a folder under sql/ = a DuckDB schema.
#   Layers run in the order written here (staging before marts).
# - Within a layer, models run in the order listed. List a model AFTER every model it selects from.
# - Model name = file stem = table name: sql/staging/stg_cbs__cpi.sql -> staging.stg_cbs__cpi
# - Every .sql file in a layer folder must be listed, and every listed model must exist;
#   the runner fails otherwise, so this file cannot silently drift from the folder.

staging:
  # Staging models read only from `raw` and are independent of each other.
  - stg_cbs__house_prices
  - stg_cbs__household_income
  - stg_cbs__regional_key_figures
  - stg_cbs__cpi
  - stg_cbs__municipalities_2026
  - stg_cbs__house_price_index
  - stg_cbs__regions_history

marts:
  # Marts read from staging and reference (the committed herindeling mapping).
  - fct_affordability
  - dim_municipality
  - dim_province
  - dim_year
