# CBS StatLine tables used by the NL Housing Affordability project.
# Every table ID, column key and dimension key below was verified against the
# CBS OData API (opendata.cbs.nl) on 2026-11-14 (metadata re-checked 2026-11-22). See docs/cbs_tables_research.md.
#
# Notes for the ingestion script:
# - Base URLs:
#     api:  https://opendata.cbs.nl/ODataApi/odata/<id>/   (max 10,000 rows per request, no $skip)
#     feed: https://opendata.cbs.nl/ODataFeed/odata/<id>/  (paged via odata.nextLink; use for bulk pulls)
#   The python package `cbsodata` wraps the feed endpoint.
# - Dimension keys can be right-padded with spaces (e.g. CPI category 'T001112  ',
#   region keys like 'CR04  ' or 'GM0363    ' in some tables). Always .strip() keys after download.
#   Filters below were tested with exactly the quoted strings.
# - Period keys look like '2024JJ00' (JJ = yearly, MM = monthly, KW = quarterly).
# - Schema: `id`, `name`, `description`, `enabled` are read by src/nl_housing/config.py;
#   the other keys (purpose, title, filters, columns, ...) document how staging should use the table.
#   ingest.py downloads complete tables; filters/columns are applied in sql/staging/.
# - `filters`, `columns`, `endpoint` are DOCUMENTATION for the staging models only: ingest.py always
#   downloads the complete table through the ODataFeed endpoint.
# - Status: approved 2026-11-22 (see docs/DECISIONS_LOG.md).

# `project` is the single source of truth for the analysis parameters: nl_housing.transform writes it to
# reference.project_settings before every build, and the SQL models and data tests read it from there.
# Change a value here, then `make transform && make check` (the tests tell you what no longer fits).
project:
  analysis_years: [2011, 2025]          # first year = base year of every growth column; 2025 income is preliminary
  target_municipal_boundaries: 2026     # municipal division of 1 January 2026 (342 municipalities)
  randstad_g4: [GM0363, GM0599, GM0518, GM0344]  # Amsterdam, Rotterdam, 's-Gravenhage, Utrecht
  randstad_provinces: [PV26, PV27, PV28]         # Utrecht, Noord-Holland, Zuid-Holland (D-010, secondary split)
  low_reliability_max_households: 5000           # D-009

tables:
  - id: 83625NED
    name: avg_sale_price_region
    description: "Average sale price of existing owner-occupied homes per municipality and year"
    enabled: true
    purpose: house_prices
    title: "Bestaande koopwoningen; gemiddelde verkoopprijzen, regio"
    title_en: "Existing own homes; average purchase prices, region"
    endpoint: feed            # ~23k rows in total; >10k limit of the api endpoint
    periods: "1995-2025 (yearly)"
    regional_level: [NL01, LD, PV, GM]
    boundaries: "boundaries of the reporting year (historical GM codes; needs harmonisation)"
    filters: "Perioden ge '2011JJ00'"
    columns:
      - RegioS
      - Perioden
      - GemiddeldeVerkoopprijs_1      # average sale price, euro

  - id: 86380NED
    name: household_income_region_2026
    description: "Household income (mean/median, disposable/standardised) per municipality, 2026 division"
    enabled: true
    purpose: household_income
    title: "Inkomen van huishoudens; huishoudenskenmerken, regio (indeling 2026)"
    title_en: "Income of households; household characteristics, region (2026 municipal division)"
    endpoint: feed
    periods: "2011-2025 (yearly; 2025 preliminary)"
    regional_level: [NL01, LD, PV, CR, AM, GM]
    boundaries: "municipal division of 1 January 2026 for all years (already harmonised)"
    filters: "Populatie eq '3000870' and (KenmerkenVanHuishoudens eq '1050010' or KenmerkenVanHuishoudens eq '1014800')"
    dimension_values:
      Populatie:
        "3000870": "Particuliere huishoudens excl. studenten (private households excl. student households)"
        "1050010": "Particuliere huishoudens incl. studenten (alternative, not loaded)"
      KenmerkenVanHuishoudens:
        "1050010": "Particuliere huishoudens (all private households)"
        "1014800": "Woningbezit: eigen woning (owner-occupier households)"
    columns:
      - Populatie
      - KenmerkenVanHuishoudens
      - RegioS
      - Perioden
      - ParticuliereHuishoudens_1             # households, x 1 000
      - GemiddeldGestandaardiseerdInkomen_3   # mean standardised income, 1 000 euro
      - MediaanGestandaardiseerdInkomen_4     # median standardised income, 1 000 euro
      - GemiddeldBesteedbaarInkomen_5         # mean disposable income, 1 000 euro
      - MediaanBesteedbaarInkomen_6           # median disposable income, 1 000 euro

  - id: 70072ned
    name: regional_key_figures
    description: "Population, households, dwelling stock and owner-occupied share per municipality and year"
    enabled: true
    purpose: population_households_housing_stock
    title: "Regionale kerncijfers Nederland"
    title_en: "Regional key figures Netherlands (translation)"
    endpoint: feed
    periods: "1995-2026 (yearly; not every column is filled for every year)"
    regional_level: [NL01, LD, PV, CR, GM]
    boundaries: "boundaries of the reporting year (historical GM codes; needs harmonisation)"
    filters: "Perioden ge '2011JJ00'"
    columns:
      - RegioS
      - Perioden
      - TotaleBevolking_1                  # population on 1 January, count
      - TotaalParticuliereHuishoudens_51   # private households, count (filled up to 2025)
      - GemiddeldeHuishoudensgrootte_58    # persons per household
      - Woningvoorraad_59                  # dwelling stock, count (filled up to 2025)
      - Koopwoningen_64                    # share of owner-occupied dwellings, %
      - GemiddeldeWOZWaardeVanWoningen_63  # mean WOZ (tax) value, 1 000 euro (2026 filled)

  - id: 86141NED
    name: cpi_2025
    description: "Consumer price index 2025=100 (yearly averages used as deflator)"
    enabled: true
    purpose: cpi
    title: "Consumentenprijzen; CPI 2025=100, index en mutaties"
    title_en: "Consumer prices; CPI 2025=100, index and rates of change"
    endpoint: api
    periods: "2009-12 to 2026-10 (monthly) plus yearly averages 2010-2025"
    regional_level: [national]
    filters: "Bestedingscategorieen eq 'T001112  ' and substringof('JJ',Perioden)"
    columns:
      - Bestedingscategorieen
      - Perioden
      - CPI_1               # index, 2025=100
      - JaarmutatieCPI_5    # year-on-year change, %

  - id: 86247NED
    name: regions_2026
    description: "Municipality list 2026 with province, COROP, size and urbanity class"
    enabled: true
    purpose: municipality_reference
    title: "Gebieden in Nederland 2026"
    title_en: "Regions in the Netherlands 2026 (translation)"
    endpoint: api
    periods: "2026 (snapshot)"
    regional_level: [GM]
    boundaries: "municipal division of 1 January 2026 (342 municipalities)"
    filters: null
    columns:
      - RegioS
      - Code_1          # municipality code GMxxxx
      - Naam_2          # municipality name
      - Code_10         # COROP code (CRxx)
      - Naam_11         # COROP name
      - Code_26         # landsdeel code (LDxx)
      - Naam_27         # landsdeel name
      - Code_28         # province code (PVxx)
      - Naam_29         # province name
      - Code_52         # municipality size class code
      - Omschrijving_53 # municipality size class
      - Code_54         # urbanity class code (1 = very strongly urban ... 5 = not urban)
      - Omschrijving_55 # urbanity class
      - Inwonertal_56   # population

  - id: 70739ned
    name: regions_since_1830
    description: "Municipal start/end dates; RegioS descriptions hold the reorganisation (herindeling) mapping"
    enabled: true
    purpose: municipal_reorganisations
    title: "Gebieden; overzicht vanaf 1830"
    title_en: "Regions; overview since 1830 (translation)"
    endpoint: feed
    periods: "status 1 January 1830 to 1 January 2026"
    regional_level: [LD, PV, CR, GM]
    filters: null
    columns:
      - RegioS
      - Begindatum_1
      - Einddatum_2
      - GebiedsOfGemeentecode_3
      - Provincie_4
    # The successor mapping is NOT in the data columns: it is in the free-text
    # `Description` field of the RegioS dimension endpoint (70739ned/RegioS).
    # Parse "Opgeheven per DD-MM-YYYY, overgegaan naar: - <name> (GMxxxx), ... <ha> hectare met <n> woningen en <n> inwoners"
    # and "Naamswijziging per DD-MM-YYYY, nieuwe naam: <name> (GMxxxx)". See docs/cbs_tables_research.md section 5.
    dimension_endpoints:
      - RegioS   # fields: Key, Title, Description -> stored by ingest.py in data/raw/70739ned/dimensions/RegioS.parquet

  # --- Optional / reference tables (verified) --------------------------------
  - id: 85792NED
    name: house_price_index_region
    description: "Quality-adjusted price index + number of transactions; only NL, LD, PV and the G4 (21 regions); quarterly + yearly rows (YYYYJJ00, 1995-2025)"
    enabled: true             # D-015: trend check vs mean price; transaction counts for G4 / Rest-of-NL aggregation (D-016)
    purpose: house_price_index_and_transactions_g4
    title: "Bestaande koopwoningen; verkoopprijzen, prijsindex 2020=100, regio"
    columns: [RegioS, Perioden, PrijsindexVerkoopprijzen_1, VerkochteWoningen_4, GemiddeldeVerkoopprijs_7]

  - id: 71905ned
    name: cpi_1900
    description: "Yearly CPI 1900-2025 (1900=100); fallback if 86141NED changes base year"
    enabled: false
    purpose: cpi_long_run
    title: "Consumentenprijzen; prijsindex 1900=100"
    columns: [Perioden, CPI_1, JaarmutatieCPI_2]

  - id: 86438NED
    name: regions_2027
    description: "Municipality list 2027 (341 municipalities; GM1696 Wijdemeren absent compared with 2026)"
    enabled: false
    purpose: municipality_reference_next_year
    title: "Gebieden in Nederland 2027"

# External sources (documented only, not ingested from this environment)
external_sources:
  - id: pdok_cbs_gebiedsindelingen
    purpose: municipality_boundaries
    url: "https://api.pdok.nl/cbs/gebiedsindelingen/ogc/v1/collections/gemeente_gegeneraliseerd/items?f=json&jaarcode=2026"
    format: "OGC API Features (GeoJSON / JSON-FG); CRS84, EPSG:28992, EPSG:3857, EPSG:4258"
    note: "Years 2016+; 1995-2015 in .../cbs/gebiedsindelingen-historisch/... . Queryable: jaarcode. Not verified from shell (host not reachable)."
  - id: dnb_mortgage_rates
    purpose: mortgage_interest_rates
    url: "https://www.dnb.nl/statistieken/dashboards/woninghypotheken/hypotheekrentes-banken/"
    note: "Bank interest rates on new residential mortgages by rate-fixation period. Exact DNB table/series ID and download URL NOT verified."
