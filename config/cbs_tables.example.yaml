# =============================================================================
# EXAMPLE CONFIG - for smoke-testing the pipeline only.
#
# The real table list lives in config/cbs_tables.yaml (created during data
# research, see docs/cbs_tables_research.md). ingest.py uses this example file
# ONLY when config/cbs_tables.yaml does not exist.
#
# Schema per entry:
#   id          (required) CBS StatLine table identifier
#   name        (optional) short snake_case alias used in docs
#   description (optional) why we need this table
#   enabled     (optional, default true) set false to skip without deleting
#   catalog     (optional, default opendata.cbs.nl)
# =============================================================================

# Same analysis parameters as config/cbs_tables.yaml (read by nl_housing.transform).
project:
  analysis_years: [2011, 2025]
  randstad_g4: [GM0363, GM0599, GM0518, GM0344]
  randstad_provinces: [PV26, PV27, PV28]
  low_reliability_max_households: 5000

tables:
  # EXAMPLE ENTRY - small national table (~540 rows), chosen because it is quick
  # to download. It is NOT necessarily part of the final analysis.
  - id: 85773NED
    name: example_house_price_index_nl
    description: "EXAMPLE - Existing owner-occupied dwellings; price index 2020=100 (national, monthly)"
    enabled: true
